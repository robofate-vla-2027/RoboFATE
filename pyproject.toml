[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robofate"
version = "1.0.0"
description = "RoboFATE: risk anticipation and corrective action for long-horizon manipulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.3.0",
    "numpy==1.26.4",
    "safetensors==0.8.0",
    "Pillow==12.1.0",
    "loguru==0.7.3",
    "megfile==5.0.17",
    "orjson==3.12.0",
    "albumentations==2.0.8",
    "opencv-python-headless==4.11.0.86",
    "accelerate==1.14.0",
    "sentencepiece==0.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["robofate*", "opendm*"]

[tool.setuptools.data-files]
"share/robofate/third_party" = ["third_party/OpenDM.LICENSE", "third_party/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
